<!doctype html>
<html lang="it" class="overflow-x-clip">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cock Rating</title>
  <meta name="description" content="Cock Rating — gestionale del pollaio e social tra allevatori (prototipo)">

  <!-- Apertura a schermo intero dalla schermata Home -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cock Rating">
  <meta name="theme-color" content="#B5442A">
  <link rel="manifest" href="manifest.webmanifest">

  <!-- Tailwind via CDN + design token -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          // Design token: modificare solo qui, mai valori scritti a mano sugli elementi
          colors: {
            brand: { DEFAULT: '#B5442A', dark: '#8A3220', soft: '#F3D9C9' },
            surface: '#FBF6EE',
            ink: { DEFAULT: '#2B2118', muted: '#6E5F52', inverse: '#FFFFFF' },
          },
          fontFamily: {
            sans: ['system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif'],
          },
          fontSize: {
            body: ['1rem', '1.5rem'],      // 16px: minimo anche per gli input
            title: ['1.75rem', '2.25rem'],
            hero: ['4rem', '1'],
          },
          spacing: {
            gutter: '1rem',
            section: '2rem',
            tap: '44px', // area toccabile minima
            // margine del contenuto + safe area del dispositivo
            'safe-t': 'calc(1rem + env(safe-area-inset-top))',
            'safe-r': 'calc(1rem + env(safe-area-inset-right))',
            'safe-b': 'calc(1rem + env(safe-area-inset-bottom))',
            'safe-l': 'calc(1rem + env(safe-area-inset-left))',
          },
          borderRadius: { button: '9999px', card: '1.5rem' },
          minHeight: { tap: '44px', screen: '100dvh' },
          minWidth: { tap: '44px', button: '10rem' },
          height: { screen: '100dvh' },
          keyframes: {
            'entra-da-destra': {
              from: { opacity: '0', transform: 'translateX(2.5rem)' },
              to: { opacity: '1', transform: 'translateX(0)' },
            },
            'entra-da-sinistra': {
              from: { opacity: '0', transform: 'translateX(-2.5rem)' },
              to: { opacity: '1', transform: 'translateX(0)' },
            },
            'sali': {
              from: { opacity: '0', transform: 'translateY(1rem)' },
              to: { opacity: '1', transform: 'translateY(0)' },
            },
            'dondola': {
              '0%, 100%': { transform: 'rotate(-8deg)' },
              '50%': { transform: 'rotate(8deg)' },
            },
            'saltella': {
              '0%, 100%': { transform: 'translateY(0)' },
              '40%': { transform: 'translateY(-0.75rem)' },
              '60%': { transform: 'translateY(0)' },
            },
          },
          animation: {
            'entra-da-destra': 'entra-da-destra 0.35s ease-out both',
            'entra-da-sinistra': 'entra-da-sinistra 0.35s ease-out both',
            'sali': 'sali 0.5s ease-out both',
            'dondola': 'dondola 1.6s ease-in-out infinite',
            'saltella': 'saltella 1.2s ease-in-out infinite',
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-surface text-ink font-sans text-body antialiased overflow-x-clip">

  <!-- Pagina 1 -->
  <section id="pagina-1" data-pagina class="hidden pt-safe-t pr-safe-r pb-safe-b pl-safe-l min-h-screen flex-col items-center justify-center text-center gap-section">
    <div class="text-hero animate-dondola" aria-hidden="true">🐓</div>
    <div class="animate-sali">
      <p class="text-ink-muted">Pagina 1</p>
      <h1 class="text-title font-bold text-brand">Cock Rating</h1>
    </div>
    <a href="#pagina-2"
       class="animate-sali ritardo-1 inline-flex items-center justify-center min-h-tap min-w-button px-section rounded-button bg-brand text-ink-inverse font-semibold shadow-lg transition active:scale-95 active:bg-brand-dark">
      Avanti →
    </a>
  </section>

  <!-- Pagina 2 -->
  <section id="pagina-2" data-pagina class="hidden pt-safe-t pr-safe-r pb-safe-b pl-safe-l min-h-screen flex-col items-center justify-center text-center gap-section bg-brand-soft">
    <div class="text-hero animate-saltella" aria-hidden="true">🥚</div>
    <div class="animate-sali">
      <p class="text-ink-muted">Pagina 2</p>
      <h1 class="text-title font-bold text-brand">Sei arrivato!</h1>
    </div>
    <a href="#pagina-1"
       class="animate-sali ritardo-1 inline-flex items-center justify-center min-h-tap min-w-button px-section rounded-button border-2 border-brand text-brand font-semibold transition active:scale-95 active:bg-brand active:text-ink-inverse">
      ← Indietro
    </a>
  </section>

  <script src="app.js"></script>
</body>
</html>
